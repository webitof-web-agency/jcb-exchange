name: Build APK (Manual)

# ✅ Sirf manually trigger hoga — GitHub Actions tab me "Run workflow" button se
on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      # 1. Code checkout
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Java setup (Android ke liye zaroori)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3. Node.js setup
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # 4. npm dependencies install
      - name: Install dependencies
        run: npm ci

      # 5. .env file banana (secrets se)
      - name: Create .env file
        run: |
          echo "WEB_APP_URL=${{ secrets.WEB_APP_URL }}" >> .env
          echo "API_BASE_URL=${{ secrets.API_BASE_URL }}" >> .env
          echo "SUPPORT_EMAIL=${{ secrets.SUPPORT_EMAIL }}" >> .env
          echo "BUSINESS_EMAIL=${{ secrets.BUSINESS_EMAIL }}" >> .env
          echo "WHATSAPP_SUPPORT_NUMBER=${{ secrets.WHATSAPP_SUPPORT_NUMBER }}" >> .env

      # 6. Keystore file decode karke rakhna (Base64 se)
      - name: Decode Keystore
        if: ${{ github.event.inputs.build_type == 'release' }}
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/jcbexchange.keystore

      # 7. Gradle permissions
      - name: Make gradlew executable
        run: chmod +x android/gradlew

      # 8. Gradle cache (build fast karne ke liye)
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      # 9. Release APK build
      - name: Build Release APK
        if: ${{ github.event.inputs.build_type == 'release' }}
        run: |
          cd android
          ./gradlew assembleRelease \
            -PMYAPP_UPLOAD_STORE_FILE=jcbexchange.keystore \
            -PMYAPP_UPLOAD_STORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }} \
            -PMYAPP_UPLOAD_KEY_ALIAS=${{ secrets.KEY_ALIAS }} \
            -PMYAPP_UPLOAD_KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}

      # 10. Debug APK build
      - name: Build Debug APK
        if: ${{ github.event.inputs.build_type == 'debug' }}
        run: |
          cd android
          ./gradlew assembleDebug

      # 11. APK ko artifact me upload karo (download ke liye)
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: JCB-Exchange-${{ github.event.inputs.build_type }}-${{ github.run_number }}
          path: |
            android/app/build/outputs/apk/release/JCB-Exchange.apk
            android/app/build/outputs/apk/debug/JCB-Exchange.apk
          retention-days: 30
