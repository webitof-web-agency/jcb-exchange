name: Build APK/AAB (Manual)

# ✅ Sirf manually trigger hoga — GitHub Actions tab me "Run workflow" button se
on:
  workflow_dispatch:
    inputs:
      build_output:
        description: 'Build Output Type'
        required: true
        default: 'apk'
        type: choice
        options:
          - apk
          - aab
          - both
      build_type:
        description: 'Build Type'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug
      web_url:
        description: 'Web App URL'
        required: false
        default: 'https://jcbexchange.com'
        type: string
      api_url:
        description: 'API Base URL'
        required: false
        default: 'https://api.jcbexchange.com'
        type: string

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: JCB-Exchange

    steps:
      # 1. Code checkout
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Java setup (Android ke liye zaroori)
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3. Node.js setup
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: JCB-Exchange/package-lock.json

      # 4. npm dependencies install
      - name: Install dependencies
        run: npm ci

      # 5. .env file banana (inputs se, ya secrets/default fallback)
      - name: Create .env file
        run: |
          WEB_URL="${{ inputs.web_url }}"
          API_URL="${{ inputs.api_url }}"
          
          if [ -z "$WEB_URL" ]; then WEB_URL="${{ secrets.WEB_APP_URL }}"; fi
          if [ -z "$API_URL" ]; then API_URL="${{ secrets.API_BASE_URL }}"; fi
          if [ -z "$WEB_URL" ]; then WEB_URL="https://jcbexchange.com"; fi
          if [ -z "$API_URL" ]; then API_URL="https://api.jcbexchange.com"; fi
          
          echo "WEB_APP_URL=$WEB_URL" > .env
          echo "API_BASE_URL=$API_URL" >> .env
          echo "SUPPORT_EMAIL=${{ secrets.SUPPORT_EMAIL || 'support@jcbexchange.com' }}" >> .env
          echo "BUSINESS_EMAIL=${{ secrets.BUSINESS_EMAIL || 'business@jcbexchange.com' }}" >> .env
          echo "WHATSAPP_SUPPORT_NUMBER=${{ secrets.WHATSAPP_SUPPORT_NUMBER || '917451965755' }}" >> .env
          
          echo "Generated .env contents:"
          cat .env

      # 7. Gradle permissions
      - name: Make gradlew executable
        run: chmod +x android/gradlew

      # 8. Gradle cache (build fast karne ke liye)
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('JCB-Exchange/android/**/*.gradle*', 'JCB-Exchange/android/**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      # 9. Release APK build
      - name: Build Release APK
        if: ${{ github.event.inputs.build_type == 'release' && (github.event.inputs.build_output == 'apk' || github.event.inputs.build_output == 'both') }}
        env:
          NODE_OPTIONS: "--max_old_space_size=4096"
        run: |
          cd android
          ./gradlew assembleRelease

      # 9.5. Release AAB build
      - name: Build Release AAB
        if: ${{ github.event.inputs.build_type == 'release' && (github.event.inputs.build_output == 'aab' || github.event.inputs.build_output == 'both') }}
        env:
          NODE_OPTIONS: "--max_old_space_size=4096"
        run: |
          cd android
          ./gradlew bundleRelease

      # 10. Debug APK build
      - name: Build Debug APK
        if: ${{ github.event.inputs.build_type == 'debug' && (github.event.inputs.build_output == 'apk' || github.event.inputs.build_output == 'both') }}
        run: |
          cd android
          ./gradlew assembleDebug

      # 10.5. Debug AAB build
      - name: Build Debug AAB
        if: ${{ github.event.inputs.build_type == 'debug' && (github.event.inputs.build_output == 'aab' || github.event.inputs.build_output == 'both') }}
        run: |
          cd android
          ./gradlew bundleDebug

      # 11. APK/AAB ko artifact me upload karo (download ke liye)
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: JCB-Exchange-${{ github.event.inputs.build_type }}-${{ github.run_number }}
          path: |
            JCB-Exchange/android/app/build/outputs/apk/release/*.apk
            JCB-Exchange/android/app/build/outputs/apk/debug/*.apk
            JCB-Exchange/android/app/build/outputs/bundle/release/*.aab
            JCB-Exchange/android/app/build/outputs/bundle/debug/*.aab
          retention-days: 30
